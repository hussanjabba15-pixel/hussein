<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CLASSIFIED</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Share+Tech+Mono&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --red:#ff2020; --gold:#c9a84c; --dark:#080808;
  --panel:#0d0d0d; --border:#1a1a1a; --text:#b0b0b0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--dark); color:var(--text);
  font-family:'Share Tech Mono',monospace;
  min-height:100vh; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; z-index:999; pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);
}
.grid{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:linear-gradient(rgba(201,168,76,.012) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.012) 1px,transparent 1px);
  background-size:60px 60px;
}
.corner{position:fixed;width:16px;height:16px;border-color:var(--gold);border-style:solid;opacity:.2;}
.corner.tl{top:14px;right:14px;border-width:1px 0 0 1px;}
.corner.tr{top:14px;left:14px;border-width:1px 1px 0 0;}
.corner.bl{bottom:14px;right:14px;border-width:0 0 1px 1px;}
.corner.br{bottom:14px;left:14px;border-width:0 1px 1px 0;}

/* HEADER */
.hdr{
  border-bottom:1px solid var(--border); padding:12px 20px;
  display:flex; align-items:center; justify-content:space-between;
  position:relative; z-index:1;
}
.hdr::after{
  content:''; position:absolute; bottom:-1px; left:0; right:0;
  height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:.25;
}
.logo{font-family:'Cinzel Decorative',serif;font-size:9px;letter-spacing:3px;color:var(--gold);opacity:.7;}
.sbar{display:flex;gap:14px;font-size:8px;letter-spacing:2px;color:#2a2a2a;}
.live{color:var(--red)!important;animation:blink 1.2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* WRAP */
.wrap{max-width:780px;margin:0 auto;padding:30px 18px 100px;}

.stamp{
  font-family:'Cinzel Decorative',serif; font-size:8px; letter-spacing:5px;
  color:var(--red); border:1px solid var(--red); display:inline-block;
  padding:3px 12px; margin-bottom:28px; opacity:.7; transform:rotate(-1.5deg);
  text-shadow:0 0 8px var(--red);
}

/* SEARCH */
.slabel{font-size:8px;letter-spacing:3px;color:#2a2a2a;margin-bottom:10px;}
.sbox{
  display:flex; border:1px solid #222; background:#0a0a0a;
  border-radius:2px; overflow:hidden;
}
.sbox input{
  flex:1; background:transparent; border:none; outline:none;
  color:var(--gold); font-family:'Amiri',serif; font-size:20px;
  padding:16px 16px; direction:rtl; caret-color:var(--gold);
  -webkit-appearance:none; border-radius:0;
}
.sbox input::placeholder{color:#1e1e1e;}
.sbtn{
  background:#0f0f0f; border:none; border-right:1px solid #1e1e1e;
  color:#3a3a3a; font-family:'Share Tech Mono',monospace;
  font-size:9px; letter-spacing:2px; padding:16px 18px;
  cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent;
  min-width:70px; touch-action:manipulation;
}
.sbtn:active{background:#151515;color:var(--gold);}

/* RESULTS */
#res{margin-top:24px; position:relative; z-index:1;}

/* SCAN */
.scan-wrap{margin-bottom:16px;}
.scan-lbl{font-size:8px;letter-spacing:3px;color:#3a3a3a;display:block;margin-bottom:8px;}
.ptrack{height:2px;background:#0f0f0f;border-radius:1px;overflow:hidden;}
.pfill{height:100%;width:0;background:var(--gold);box-shadow:0 0 6px var(--gold);}
.ppct{font-size:7px;letter-spacing:2px;color:#2a2a2a;display:block;margin-top:5px;text-align:left;}

/* LOG */
.logbox{
  margin-top:10px; font-size:7px; letter-spacing:1px;
  color:#242424; direction:ltr; text-align:left;
  max-height:80px; overflow:hidden;
}
.lline{padding:2px 0;}
.lline.ok{color:#1a2e1a;}

/* FILE */
.fblock{
  border:1px solid var(--border); background:var(--panel);
  padding:18px 16px; margin-bottom:14px; position:relative; overflow:hidden;
}
.fblock::before{
  content:''; position:absolute; top:0; right:0;
  width:3px; height:100%;
  background:linear-gradient(180deg,var(--gold),transparent); opacity:.1;
}
.fid{font-size:7px;letter-spacing:3px;color:#1e1e1e;margin-bottom:10px;}
.rline{height:8px;background:#0f0f0f;margin-bottom:6px;border-radius:1px;position:relative;}
.rline::after{
  content:'███ REDACTED ███████████████████';
  position:absolute; inset:0; font-size:6px; letter-spacing:1px;
  color:#161616; overflow:hidden; display:flex; align-items:center; padding:0 6px;
}

/* REVEAL */
.rblock{border:1px solid #161616;background:#050505;padding:18px 16px;}
.dlbl{font-size:8px;letter-spacing:3px;color:#2e2e2e;display:block;margin-bottom:8px;}
.dtrack{height:2px;background:#0f0f0f;overflow:hidden;border-radius:1px;}
.dfill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fffbe8);box-shadow:0 0 8px var(--gold);}
.fans{padding-top:18px;border-top:1px solid #111;margin-top:14px;display:none;}
.atag{font-size:7px;letter-spacing:4px;color:var(--gold);opacity:.5;margin-bottom:8px;text-transform:uppercase;}
.aname{
  font-family:'Amiri',serif; font-size:32px; color:#fff;
  text-shadow:0 0 24px rgba(201,168,76,.2); margin-bottom:6px; min-height:40px;
}
.asub{font-size:7px;letter-spacing:2px;color:#242424;}
.pdot{
  display:inline-block; width:5px; height:5px; border-radius:50%;
  background:var(--gold); margin-right:5px;
  animation:pulse 2s infinite; vertical-align:middle;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,.4)}50%{box-shadow:0 0 0 5px rgba(201,168,76,0)}}

/* FOOTER */
.foot{
  position:fixed; bottom:0; left:0; right:0; z-index:2;
  border-top:1px solid #0e0e0e; padding:7px 18px;
  display:flex; justify-content:space-between;
  font-size:7px; letter-spacing:2px; color:#1a1a1a;
  background:rgba(8,8,8,.98);
}

/* ANIM */
.fadein{animation:fi .4s ease both;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes unblur{from{opacity:0;filter:blur(8px)}to{opacity:1;filter:blur(0)}}
</style>
</head>
<body>
<div class="grid"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div class="hdr">
  <div class="logo">◈ ORACLE SYSTEM v2.7</div>
  <div class="sbar">
    <span class="live">● LIVE</span>
    <span>ENCRYPTED</span>
    <span>7F-ALPHA</span>
  </div>
</div>

<div class="wrap">
  <div class="stamp">⬛ CLASSIFIED — ACCESS GRANTED</div>
  <div class="slabel">// استعلام قاعدة البيانات السرية</div>
  <div class="sbox">
    <input id="inp" type="search" placeholder="اكتب سؤالك هنا..."
      autocomplete="off" autocorrect="off" autocapitalize="off"
      spellcheck="false" enterkeyhint="search" inputmode="text" />
    <button id="btn" class="sbtn" type="button">SCAN ▸</button>
  </div>
  <div id="res"></div>
</div>

<div class="foot">
  <span>SYS: OPERATIONAL</span>
  <span id="clk"></span>
  <span>CLEARANCE: TIER-1</span>
</div>

<script>
(function(){
  var DB = {
    "من هو واحد حله":{
      id:"REC-0047-ALPHA", answer:"شهد الجنابي",
      tag:"الهوية المكتشفة — IDENTITY RESOLVED",
      sub:"SUBJECT IDENTIFIED ● RECORD SEALED",
      nodes:["NODE-7F","SRV-ALPHA","DB-CORE-9","ARCHIVE-Ω"]
    },
    "من هي واحد قانون":{
      id:"REC-0091-BETA", answer:"شهد الجنابي",
      tag:"الهوية المكتشفة — IDENTITY RESOLVED",
      sub:"SUBJECT IDENTIFIED ● RECORD SEALED",
      nodes:["NODE-3C","SRV-BETA","DB-CORE-2","ARCHIVE-Ω"]
    }
  };

  function norm(s){
    return s.trim()
      .replace(/[؟?!،,\.]/g,'')
      .replace(/[ىي]/g,'ي')
      .replace(/[أإآا]/g,'ا')
      .replace(/[ةه]/g,'ه')
      .replace(/\s+/g,' ')
      .toLowerCase();
  }

  var inp  = document.getElementById('inp');
  var btn  = document.getElementById('btn');
  var res  = document.getElementById('res');
  var busy = false;

  function go(){
    if(busy) return;
    var raw = inp.value;
    if(!raw.trim()) return;
    inp.blur(); // close keyboard on mobile
    var q = norm(raw);
    var match = null;
    for(var k in DB){ if(norm(k)===q){ match=DB[k]; break; } }
    busy = true;
    btn.textContent = '...';
    res.innerHTML = '';
    if(match) doMatch(match);
    else doNoMatch();
  }

  // Wire up every possible trigger
  btn.addEventListener('click',   go);
  btn.addEventListener('touchend', function(e){ e.preventDefault(); go(); });
  inp.addEventListener('keydown', function(e){ if(e.keyCode===13||e.key==='Enter') go(); });
  inp.addEventListener('keyup',   function(e){ if(e.keyCode===13||e.key==='Enter') go(); });

  /* ── MATCH SEQUENCE ── */
  function doMatch(rec){
    // Build full HTML upfront, hidden
    res.innerHTML =
      '<div class="scan-wrap fadein" id="sw">'+
        '<span class="scan-lbl" id="sl">INITIALIZING SCAN...</span>'+
        '<div class="ptrack"><div class="pfill" id="pf"></div></div>'+
        '<span class="ppct" id="pp">0%</span>'+
        '<div class="logbox" id="lb"></div>'+
      '</div>'+
      '<div id="fb" style="display:none" class="fblock fadein">'+
        '<div class="fid">// FILE: '+rec.id+' — DECRYPTED FRAGMENT</div>'+
        '<div class="rline"></div>'+
        '<div class="rline" style="width:74%"></div>'+
        '<div class="rline" style="width:85%"></div>'+
        '<div class="rline" style="width:52%"></div>'+
      '</div>'+
      '<div id="rb" style="display:none" class="rblock fadein">'+
        '<span class="dlbl" id="dl">DECRYPTING CORE IDENTITY...</span>'+
        '<div class="dtrack"><div class="dfill" id="df"></div></div>'+
        '<div class="fans" id="fa">'+
          '<div class="atag">'+rec.tag+'</div>'+
          '<div class="aname" id="an"></div>'+
          '<div class="asub">'+rec.sub+'</div>'+
        '</div>'+
      '</div>';

    var steps = [
      {p:14, ms:350, msg:'> CONNECTING TO '+rec.nodes[0]+'...'},
      {p:35, ms:420, msg:'> QUERYING '+rec.nodes[1]+'...'},
      {p:60, ms:480, msg:'> MATCH DETECTED — CROSS-REF '+rec.nodes[2]},
      {p:82, ms:530, msg:'> DECRYPTING '+rec.id+'...'},
      {p:100,ms:340, msg:'> ████ ACCESS GRANTED ████', ok:true}
    ];

    var si = 0;
    function nextStep(){
      if(si >= steps.length){
        // scan done
        var sl = document.getElementById('sl');
        if(sl){ sl.textContent='SCAN COMPLETE — 1 RECORD FOUND'; sl.style.color='var(--gold)'; }
        setTimeout(showFile, 600);
        return;
      }
      var s = steps[si++];
      setTimeout(function(){
        var pf=document.getElementById('pf');
        var pp=document.getElementById('pp');
        var lb=document.getElementById('lb');
        if(pf) pf.style.width=s.p+'%';
        if(pp) pp.textContent=s.p+'%';
        if(lb){
          var d=document.createElement('div');
          d.className='lline'+(s.ok?' ok':'');
          d.textContent=s.msg;
          lb.appendChild(d);
        }
        nextStep();
      }, s.ms);
    }
    nextStep();

    function showFile(){
      var fb=document.getElementById('fb');
      if(fb) fb.style.display='block';
      setTimeout(showDecrypt, 900);
    }

    function showDecrypt(){
      var rb=document.getElementById('rb');
      if(rb) rb.style.display='block';
      var pct=0;
      var iv=setInterval(function(){
        pct+=2; if(pct>100) pct=100;
        var df=document.getElementById('df');
        if(df) df.style.width=pct+'%';
        if(pct>=100){
          clearInterval(iv);
          var dl=document.getElementById('dl');
          if(dl){ dl.textContent='IDENTITY UNLOCKED'; dl.style.color='var(--gold)'; }
          setTimeout(showName, 300);
        }
      }, 20);
    }

    function showName(){
      var fa=document.getElementById('fa');
      if(fa){ fa.style.display='block'; fa.style.animation='unblur .5s ease'; }
      var name=rec.answer;
      var ci=0;
      var an=document.getElementById('an');
      var iv=setInterval(function(){
        if(!an) an=document.getElementById('an');
        if(!an){ clearInterval(iv); done(); return; }
        if(ci<=name.length){
          an.textContent=name.slice(0,ci);
          ci++;
        } else {
          clearInterval(iv);
          var dot=document.createElement('span');
          dot.className='pdot';
          an.appendChild(dot);
          done();
        }
      }, 65);
    }
  }

  /* ── NO MATCH ── */
  function doNoMatch(){
    res.innerHTML=
      '<div class="scan-wrap fadein">'+
        '<span class="scan-lbl" id="sl2">SCANNING DATABASE...</span>'+
        '<div class="ptrack"><div class="pfill" id="pf2"></div></div>'+
        '<span class="ppct" id="pp2">0%</span>'+
      '</div>'+
      '<div id="nb" style="display:none" class="fblock fadein" style="border-color:#2a1010">'+
        '<div class="fid" style="color:#2a1010">// STATUS: QUERY NOT IN DATABASE — ACCESS DENIED</div>'+
        '<div class="rline"></div>'+
        '<div class="rline" style="width:58%"></div>'+
      '</div>';

    var pct=0;
    var iv=setInterval(function(){
      pct+=4; if(pct>100) pct=100;
      var pf2=document.getElementById('pf2');
      var pp2=document.getElementById('pp2');
      if(pf2) pf2.style.width=pct+'%';
      if(pp2) pp2.textContent=pct+'%';
      if(pct>=100){
        clearInterval(iv);
        var sl2=document.getElementById('sl2');
        if(sl2){ sl2.textContent='SCAN COMPLETE — NO RECORDS FOUND'; sl2.style.color='#553333'; }
        setTimeout(function(){
          var nb=document.getElementById('nb');
          if(nb){ nb.style.display='block'; nb.style.borderColor='#2a1010'; }
          done();
        }, 400);
      }
    }, 22);
  }

  function done(){
    busy=false;
    btn.textContent='SCAN ▸';
  }

  // Clock
  function tick(){
    var c=document.getElementById('clk');
    if(c) c.textContent=new Date().toTimeString().slice(0,8)+' UTC';
  }
  tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
